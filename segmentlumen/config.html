<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Segment Lumen Settings</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f0f0;color:#222;max-width:480px;margin:0 auto;padding:12px}
h1{font-size:18px;text-align:center;margin:12px 0 16px;font-weight:700;letter-spacing:1px}
h2{font-size:11px;color:#888;margin:16px 0 8px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* Watchface preview */
.watch-wrap{display:flex;justify-content:center;margin:8px 0 4px}
.watch{width:180px;height:188px;border-radius:10px;overflow:hidden;border:2px solid #ddd;position:relative;display:flex;flex-direction:column}
.w-bar{height:22px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:11px;font-weight:700;flex-shrink:0}
.w-row{height:22px;display:flex;align-items:center;justify-content:space-around;padding:0 8px;font-size:11px;font-weight:600;border-top:1px solid transparent}
.w-time-area{flex:1;display:flex;align-items:center;justify-content:center}
.w-time{font-family:monospace;font-size:44px;font-weight:900;letter-spacing:-1px}
.w-divider{height:1px;margin:0;flex-shrink:0}

/* Theme presets */
.themes{display:flex;flex-wrap:wrap;gap:8px}
.theme-btn{padding:8px 14px;border-radius:20px;border:2px solid #ddd;font-size:13px;font-weight:600;cursor:pointer;background:#fff;transition:all .15s}
.theme-btn.active{transform:scale(1.05)}

/* Color pickers */
.color-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.color-item label{font-size:12px;color:#666;margin-bottom:4px;display:block}
.color-swatch{width:100%;height:40px;border-radius:8px;border:1px solid #ddd;cursor:pointer;padding:3px}

/* City search */
.search-wrap{position:relative}
#cityInput{width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:10px;font-size:16px;outline:none;transition:border .15s}
#cityInput:focus{border-color:#4CAF50}
#suggestions{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid #ddd;border-top:none;border-radius:0 0 10px 10px;z-index:10;max-height:200px;overflow-y:auto;display:none}
.suggest-item{padding:10px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid #f0f0f0}
.suggest-item:last-child{border-bottom:none}
.suggest-item:hover{background:#f5f5f5}
.coords{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.coords input{padding:8px 10px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;color:#888}

/* Timezone */
#tzSearch{width:100%;padding:10px;border:1.5px solid #ddd;border-radius:10px;font-size:15px;margin-bottom:8px;outline:none}
#tzSearch:focus{border-color:#4CAF50}
#tzList{max-height:200px;overflow-y:auto;border:1.5px solid #ddd;border-radius:10px}
.tz-item{padding:10px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between}
.tz-item:last-child{border-bottom:none}
.tz-item:hover,.tz-item.selected{background:#e8f5e9}
.tz-offset{color:#888;font-size:12px}

/* Save button */
.save-btn{display:block;width:100%;padding:15px;background:#4CAF50;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px;letter-spacing:.5px}
.save-btn:active{background:#388E3C;transform:scale(.98)}
</style>
</head>
<body>

<h1>⌚ SEGMENT LUMEN</h1>

<!-- Live watchface preview -->
<div class="card">
<h2>Preview</h2>
<div class="watch-wrap">
  <div class="watch" id="watch">
    <div class="w-bar" id="wTopBar"><span>SAT</span><span>MAY 23</span><span>80%</span></div>
    <div class="w-row" id="wRow1"><span>37 <b id="r1a">STP</b></span><span>75 <b id="r1b">HR</b></span><span>ON <b id="r1c">BT</b></span></div>
    <div class="w-divider" id="wDiv1"></div>
    <div class="w-time-area"><span class="w-time" id="wTime">12:56</span></div>
    <div class="w-divider" id="wDiv2"></div>
    <div class="w-row" id="wRow2"><span>24 <b id="r2a">C</b></span><span id="r2b">CLOUD</span><span>6 <b id="r2c">UV</b></span></div>
    <div class="w-bar" id="wBotBar"><span id="wTZ">NYC 5:55 PM</span></div>
  </div>
</div>
</div>

<!-- Theme presets -->
<div class="card">
<h2>Theme Presets</h2>
<div class="themes" id="presets"></div>
</div>

<!-- Colors -->
<div class="card">
<h2>Colors</h2>
<div class="color-grid">
  <div class="color-item"><label>Background</label><input type="color" class="color-swatch" id="cBg" value="#ffffff"></div>
  <div class="color-item"><label>Text &amp; Segments</label><input type="color" class="color-swatch" id="cInk" value="#1c2e0f"></div>
  <div class="color-item"><label>Accent (bars)</label><input type="color" class="color-swatch" id="cAccent" value="#76945c"></div>
</div>
<p style="font-size:12px;color:#888;margin-top:8px">Ghost segment color is automatically calculated from accent</p>
</div>

<!-- City / Weather location -->
<div class="card">
<h2>Weather Location</h2>
<div class="search-wrap">
  <input type="text" id="cityInput" placeholder="Search city..." autocomplete="off">
  <div id="suggestions"></div>
</div>
<div class="coords">
  <input type="text" id="latOut" placeholder="Latitude" readonly>
  <input type="text" id="lonOut" placeholder="Longitude" readonly>
</div>
</div>

<!-- Timezone -->
<div class="card">
<h2>2nd Time Zone</h2>
<input type="text" id="tzSearch" placeholder="Search timezone or city...">
<div id="tzList"></div>
</div>

<button class="save-btn" onclick="saveSettings()">Save to Watch</button>

<script>
// ── Themes ────────────────────────────────────────────────────────────────
var THEMES = {
  Green:   {bg:"#ffffff",ink:"#1c2e0f",accent:"#76945c"},
  Blue:    {bg:"#ffffff",ink:"#121e37",accent:"#406ea5"},
  Amber:   {bg:"#ffffff",ink:"#2e2008",accent:"#c48c2a"},
  Crimson: {bg:"#ffffff",ink:"#300e12",accent:"#aa383e"},
  Dark:    {bg:"#121212",ink:"#ebebeb",accent:"#6e9658"},
  Navy:    {bg:"#0a0f1e",ink:"#7eb8f7",accent:"#2a5fa5"},
  Rose:    {bg:"#fff5f5",ink:"#4a1010",accent:"#c06060"},
  Forest:  {bg:"#f5fff7",ink:"#0f2e18",accent:"#3a7a50"},
};

// ── World Timezones ───────────────────────────────────────────────────────
var TIMEZONES = [
  {label:"UTC",    offset:0,    city:"Universal"},
  {label:"LON",    offset:0,    city:"London"},
  {label:"DUB",    offset:1,    city:"Dublin"},

  {label:"BRU",    offset:1,    city:"Brussels"},

  {label:"BUD",    offset:1,    city:"Budapest"},
  {label:"PRG",    offset:1,    city:"Prague"},
  {label:"STO",    offset:1,    city:"Stockholm"},
  {label:"OSL",    offset:1,    city:"Oslo"},
  {label:"CPH",    offset:1,    city:"Copenhagen"},
  {label:"HEL",    offset:2,    city:"Helsinki"},
  {label:"RIG",    offset:2,    city:"Riga"},

  {label:"CAI",    offset:2,    city:"Cairo"},
  {label:"JRS",    offset:2,    city:"Jerusalem"},

  {label:"ABU",    offset:4,    city:"Abu Dhabi"},
  {label:"BAK",    offset:4,    city:"Baku"},
  {label:"TBS",    offset:4,    city:"Tbilisi"},
  {label:"KBL",    offset:"4.5",city:"Kabul"},

  {label:"DEL",    offset:"5.5",city:"New Delhi"},
  {label:"BOM",    offset:"5.5",city:"Mumbai"},

  {label:"TYO",    offset:9,    city:"Tokyo"},
  {label:"ADL",    offset:"9.5",city:"Adelaide"},
  {label:"SYD",    offset:10,   city:"Sydney"},
  {label:"MEL",    offset:10,   city:"Melbourne"},

  {label:"ATL",    offset:-5,   city:"Atlanta"},
  {label:"TOR",    offset:-5,   city:"Toronto"},
  {label:"MTL",    offset:-5,   city:"Montreal"},

  {label:"MEX",    offset:-6,   city:"Mexico City"},
  {label:"DEN",    offset:-7,   city:"Denver"},
  {label:"PHX",    offset:-7,   city:"Phoenix"},

  {label:"SEA",    offset:-8,   city:"Seattle"},
  {label:"VAN",    offset:-8,   city:"Vancouver"},
  {label:"ANC",    offset:-9,   city:"Anchorage"},
  {label:"HNL",    offset:-10,  city:"Honolulu"},
  {label:"SAO",    offset:-3,   city:"Sao Paulo"},
  {label:"RIO",    offset:-3,   city:"Rio de Janeiro"},
  {label:"BUE",    offset:-3,   city:"Buenos Aires"},
  {label:"SCL",    offset:-4,   city:"Santiago"},
  {label:"CCS",    offset:-4,   city:"Caracas"},
  {label:"GRU",    offset:-3,   city:"Guarulhos"},
  {label:"ACC",    offset:0,    city:"Accra"},
  {label:"LOS",    offset:1,    city:"Lagos"},
  {label:"DKR",    offset:0,    city:"Dakar"},
  {label:"CMN",    offset:1,    city:"Casablanca"},
  {label:"ALG",    offset:1,    city:"Algiers"},
  {label:"TUN",    offset:1,    city:"Tunis"},
];

// ── State ─────────────────────────────────────────────────────────────────
var state = {
  bg: "#ffffff", ink: "#1c2e0f", accent: "#76945c",
  lat: 32.81, lon: -96.95,
  tz: TIMEZONES.find(function(t){return t.label==="NYC";})
};

// ── Color utilities ───────────────────────────────────────────────────────
function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}
function rgbToHex(r,g,b) {
  return "#"+[r,g,b].map(function(v){return ("0"+v.toString(16)).slice(-2);}).join("");
}
// Blend two hex colors: ratio 0=col1, 1=col2
function blendHex(col1, col2, ratio) {
  var a = hexToRgb(col1), b = hexToRgb(col2);
  return rgbToHex(
    Math.round(a[0]+(b[0]-a[0])*ratio),
    Math.round(a[1]+(b[1]-a[1])*ratio),
    Math.round(a[2]+(b[2]-a[2])*ratio)
  );
}
// Ghost = blend accent toward background (70% bg, 30% accent)
function calcGhost(accent, bg) { return blendHex(accent, bg, 0.7); }

// ── Build preset buttons ──────────────────────────────────────────────────
var presetsDiv = document.getElementById("presets");
Object.keys(THEMES).forEach(function(name) {
  var t = THEMES[name];
  var btn = document.createElement("button");
  btn.className = "theme-btn";
  btn.textContent = name;
  btn.style.background = t.bg;
  btn.style.color = t.ink;
  btn.style.borderColor = t.accent;
  btn.onclick = function() {
    document.getElementById("cBg").value     = t.bg;
    document.getElementById("cInk").value    = t.ink;
    document.getElementById("cAccent").value = t.accent;
    state.bg = t.bg; state.ink = t.ink; state.accent = t.accent;
    document.querySelectorAll(".theme-btn").forEach(function(b){b.classList.remove("active");});
    btn.classList.add("active");
    updatePreview();
  };
  presetsDiv.appendChild(btn);
});

// ── Timezone list ─────────────────────────────────────────────────────────
function renderTzList(filter) {
  var list = document.getElementById("tzList");
  list.innerHTML = "";
  var filtered = TIMEZONES.filter(function(tz) {
    if (!filter) return true;
    var q = filter.toLowerCase();
    return tz.city.toLowerCase().indexOf(q) >= 0 || tz.label.toLowerCase().indexOf(q) >= 0;
  });
  filtered.forEach(function(tz) {
    var item = document.createElement("div");
    item.className = "tz-item" + (state.tz && state.tz.label === tz.label ? " selected" : "");
    var sign = tz.offset >= 0 ? "+" : "";
    item.innerHTML = '<span>' + tz.city + ' <b>' + tz.label + '</b></span><span class="tz-offset">UTC' + sign + tz.offset + '</span>';
    item.onclick = function() {
      state.tz = tz;
      document.querySelectorAll(".tz-item").forEach(function(i){i.classList.remove("selected");});
      item.classList.add("selected");
      updatePreview();
    };
    list.appendChild(item);
  });
}
renderTzList("");
document.getElementById("tzSearch").addEventListener("input", function() {
  renderTzList(this.value);
});

// ── City autocomplete using Open-Meteo geocoding ──────────────────────────
var searchTimer = null;
document.getElementById("cityInput").addEventListener("input", function() {
  clearTimeout(searchTimer);
  var q = this.value.trim();
  if (q.length < 3) { document.getElementById("suggestions").style.display = "none"; return; }
  searchTimer = setTimeout(function() { searchCity(q); }, 300);
});

function searchCity(q) {
  fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(q) + "&count=6&language=en")
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var sug = document.getElementById("suggestions");
      sug.innerHTML = "";
      if (!data.results || !data.results.length) { sug.style.display = "none"; return; }
      data.results.forEach(function(r) {
        var item = document.createElement("div");
        item.className = "suggest-item";
        var country = r.country_code || "";
        var admin = r.admin1 ? ", " + r.admin1 : "";
        item.textContent = r.name + admin + " (" + country + ")";
        item.onclick = function() {
          document.getElementById("cityInput").value = item.textContent;
          document.getElementById("latOut").value    = r.latitude.toFixed(4);
          document.getElementById("lonOut").value    = r.longitude.toFixed(4);
          state.lat = r.latitude;
          state.lon = r.longitude;
          sug.style.display = "none";
        };
        sug.appendChild(item);
      });
      sug.style.display = "block";
    })
    .catch(function() {});
}

document.addEventListener("click", function(e) {
  if (!e.target.closest(".search-wrap"))
    document.getElementById("suggestions").style.display = "none";
});

// ── Live preview ──────────────────────────────────────────────────────────
function updatePreview() {
  var bg     = document.getElementById("cBg").value;
  var ink    = document.getElementById("cInk").value;
  var accent = document.getElementById("cAccent").value;
  state.bg = bg; state.ink = ink; state.accent = accent;

  var watch   = document.getElementById("watch");
  var topBar  = document.getElementById("wTopBar");
  var botBar  = document.getElementById("wBotBar");
  var row1    = document.getElementById("wRow1");
  var row2    = document.getElementById("wRow2");
  var time    = document.getElementById("wTime");
  var div1    = document.getElementById("wDiv1");
  var div2    = document.getElementById("wDiv2");
  var tzLabel = document.getElementById("wTZ");

  watch.style.background  = bg;
  topBar.style.background = accent;
  botBar.style.background = accent;
  topBar.style.color      = bg;
  botBar.style.color      = bg;
  row1.style.color        = ink;
  row2.style.color        = ink;
  time.style.color        = ink;
  div1.style.background   = accent;
  div2.style.background   = accent;

  // Accent labels in rows
  ["r1a","r1b","r1c","r2a","r2b","r2c"].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.style.color = accent;
  });

  // Update TZ label
  if (state.tz) {
    var now = new Date();
    var utc = now.getTime() + now.getTimezoneOffset() * 60000;
    var tz2 = new Date(utc + Number(state.tz.offset) * 3600000);
    var h = tz2.getHours(), m = tz2.getMinutes();
    var ampm = h < 12 ? "AM" : "PM";
    var h12 = h % 12 || 12;
    var mm = ("0" + m).slice(-2);
    tzLabel.textContent = state.tz.label + " " + h12 + ":" + mm + " " + ampm;
  }

  // Update time
  var now2 = new Date();
  var h = now2.getHours() % 12 || 12;
  var m = ("0" + now2.getMinutes()).slice(-2);
  time.textContent = ("0" + h).slice(-2) + ":" + m;
}

// Update every 30s
setInterval(updatePreview, 30000);

// ── Color picker listeners ────────────────────────────────────────────────
["cBg","cInk","cAccent"].forEach(function(id) {
  document.getElementById(id).addEventListener("input", updatePreview);
});

// ── Load existing settings from URL hash ─────────────────────────────────
function loadSettings() {
  if (!location.hash || location.hash.length < 2) { updatePreview(); return; }
  try {
    var cfg = JSON.parse(decodeURIComponent(location.hash.slice(1)));
    if (cfg.bg)     document.getElementById("cBg").value     = cfg.bg;
    if (cfg.ink)    document.getElementById("cInk").value    = cfg.ink;
    if (cfg.accent) document.getElementById("cAccent").value = cfg.accent;
    if (cfg.lat)    { state.lat = cfg.lat; document.getElementById("latOut").value = cfg.lat; }
    if (cfg.lon)    { state.lon = cfg.lon; document.getElementById("lonOut").value = cfg.lon; }
    if (cfg.tz) {
      var found = TIMEZONES.find(function(t) { return t.label === cfg.tz.label; });
      if (found) { state.tz = found; renderTzList(""); }
    }
  } catch(e) {}
  updatePreview();
}

// ── Save settings ─────────────────────────────────────────────────────────
function saveSettings() {
  var bg     = document.getElementById("cBg").value;
  var ink    = document.getElementById("cInk").value;
  var accent = document.getElementById("cAccent").value;
  var ghost  = calcGhost(accent, bg);

  function pack(hex) {
    var rgb = hexToRgb(hex);
    return rgb[0] * 65536 + rgb[1] * 256 + rgb[2];
  }

  var result = {
    bg: bg, ink: ink, accent: accent, ghost: ghost,
    bgRgb:     hexToRgb(bg),
    inkRgb:    hexToRgb(ink),
    accentRgb: hexToRgb(accent),
    ghostRgb:  hexToRgb(ghost),
    lat: state.lat,
    lon: state.lon,
    tz: state.tz,
  };

  var ua = navigator.userAgent;
  if (ua.indexOf("Pebble") >= 0 || ua.indexOf("PebbleKit") >= 0) {
    location.href = "pebblejs://close#" + encodeURIComponent(JSON.stringify(result));
  } else {
    alert("On watch:\n" + JSON.stringify(result, null, 2));
  }
}

loadSettings();
</script>
</body>
</html>
