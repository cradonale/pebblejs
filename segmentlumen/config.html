<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Segment Lumen Settings</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--site-bg,#f0f0f0);color:var(--site-ink,#222);max-width:480px;margin:0 auto;padding:12px;transition:background .3s,color .3s}
h1{font-size:18px;text-align:center;margin:12px 0 16px;font-weight:700;letter-spacing:1px;color:var(--site-ink,#222)}
h2{font-size:11px;color:var(--site-muted,#888);margin:16px 0 8px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.card{background:var(--site-card,#fff);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.1);transition:background .3s}
.watch-wrap{display:flex;justify-content:center;margin:8px 0 4px}
.watch{width:180px;height:188px;border-radius:10px;overflow:hidden;border:2px solid #ddd;display:flex;flex-direction:column}
.w-bar{height:22px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:11px;font-weight:700;flex-shrink:0}
.w-row{height:22px;display:flex;align-items:center;justify-content:space-around;padding:0 8px;font-size:11px;font-weight:600}
.w-time-area{flex:1;display:flex;align-items:center;justify-content:center}
.w-time{font-family:monospace;font-size:44px;font-weight:900;letter-spacing:-1px}
.w-divider{height:1px;flex-shrink:0}
.w-tz-bar{height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.theme-btn{padding:8px 14px;border-radius:20px;border:2px solid #ddd;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.theme-btn.active{transform:scale(1.05)}
.saved-schemes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;min-height:0}
.color-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.color-item label{font-size:12px;color:var(--site-muted,#666);margin-bottom:4px;display:block}
.color-swatch{width:100%;height:40px;border-radius:8px;border:1px solid #ddd;cursor:pointer;padding:3px}
.scheme-name-row{display:flex;gap:8px;margin-top:12px}
.scheme-name-row input{flex:1;padding:10px;border:1.5px solid var(--site-border,#ddd);border-radius:10px;font-size:15px;background:var(--site-card,#fff);color:var(--site-ink,#222)}
.scheme-save-btn{padding:10px 16px;background:var(--accent,#76945c);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.search-wrap{position:relative}
input[type=text]{width:100%;padding:10px 12px;border:1.5px solid var(--site-border,#ddd);border-radius:10px;font-size:15px;outline:none;background:var(--site-card,#fff);color:var(--site-ink,#222)}
input:focus{border-color:var(--accent,#76945c)}
#suggestions{position:absolute;top:100%;left:0;right:0;background:var(--site-card,#fff);border:1.5px solid var(--site-border,#ddd);border-top:none;border-radius:0 0 10px 10px;z-index:10;max-height:200px;overflow-y:auto;display:none}
.suggest-item{padding:10px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--site-border,#f0f0f0);color:var(--site-ink,#222)}
.suggest-item:hover{background:var(--site-hover,#f5f5f5)}
#tzSearch{width:100%;padding:10px;border:1.5px solid var(--site-border,#ddd);border-radius:10px;font-size:15px;margin-bottom:8px;outline:none;background:var(--site-card,#fff);color:var(--site-ink,#222)}
#tzList{max-height:200px;overflow-y:auto;border:1.5px solid var(--site-border,#ddd);border-radius:10px}
.tz-item{padding:10px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--site-border,#f0f0f0);display:flex;justify-content:space-between;color:var(--site-ink,#222)}
.tz-item:hover,.tz-item.selected{background:var(--site-hover,#e8f5e9)}
.tz-offset{color:var(--site-muted,#888);font-size:12px}
.save-btn{display:block;width:100%;padding:15px;background:var(--accent,#76945c);color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px}
.save-btn:active{filter:brightness(.9);transform:scale(.98)}
.city-selected{margin-top:6px;font-size:13px;color:var(--site-muted,#888)}
</style>
</head>
<body>
<h1>⌚ SEGMENT LUMEN</h1>

<div class="card">
<h2>Preview</h2>
<div class="watch-wrap">
  <div class="watch" id="watch">
    <div class="w-bar" id="wTopBar"><span>SAT</span><span>MAY 23</span><span>80%</span></div>
    <div class="w-row" id="wRow1"><span>37 <b id="r1a">STP</b></span><span>75 <b id="r1b">HR</b></span><span>ON <b id="r1c">BT</b></span></div>
    <div class="w-divider" id="wDiv1"></div>
    <div class="w-time-area"><span class="w-time" id="wTime">12:56</span></div>
    <div class="w-divider" id="wDiv2"></div>
    <div class="w-row" id="wRow2"><span>24 <b id="r2a">C</b></span><span id="r2b">CLOUD</span><span>6 <b id="r2c">UV</b></span></div>
    <div class="w-tz-bar" id="wBotBar"><span id="wTZ">NYC 5:55 PM</span></div>
  </div>
</div>
</div>

<div class="card">
<h2>Built-in Themes</h2>
<div class="themes" id="presets"></div>
<div id="savedPresetsWrap" style="margin-top:10px;display:none">
<h2 style="margin-top:0">My Saved Schemes</h2>
<div class="themes" id="savedPresetBtns"></div>
</div>
</div>

<div class="card">
<h2>Colors</h2>
<div class="color-grid">
  <div class="color-item"><label>Background</label><input type="color" class="color-swatch" id="cBg" value="#ffffff"></div>
  <div class="color-item"><label>Text &amp; Segments</label><input type="color" class="color-swatch" id="cInk" value="#1c2e0f"></div>
  <div class="color-item"><label>Accent (bars)</label><input type="color" class="color-swatch" id="cAccent" value="#76945c"></div>
</div>
<div class="scheme-name-row">
  <input type="text" id="schemeName" placeholder="Name your color scheme...">
  <button class="scheme-save-btn" onclick="saveScheme()">Save Scheme</button>
</div>
<h2 style="margin-top:14px">Saved Schemes</h2>
<div class="saved-schemes" id="savedSchemes"></div>
</div>

<div class="card">
<h2>Weather Location</h2>
<div class="search-wrap">
  <input type="text" id="cityInput" placeholder="Search city for weather..." autocomplete="off">
  <div id="suggestions"></div>
</div>
<div class="city-selected" id="citySelected"></div>
</div>

<div class="card">
<h2>2nd Time Zone</h2>
<input type="text" id="tzSearch" placeholder="Search timezone or city...">
<div id="tzList"></div>
</div>

<button class="save-btn" onclick="saveSettings()">Save to Watch</button>

<script>
var THEMES = {
  Green:   {bg:"#ffffff",ink:"#1c2e0f",accent:"#76945c"},
  Blue:    {bg:"#ffffff",ink:"#121e37",accent:"#406ea5"},
  Amber:   {bg:"#ffffff",ink:"#2e2008",accent:"#c48c2a"},
  Crimson: {bg:"#ffffff",ink:"#300e12",accent:"#aa383e"},
  Dark:    {bg:"#121212",ink:"#ebebeb",accent:"#6e9658"},
  Navy:    {bg:"#0a0f1e",ink:"#7eb8f7",accent:"#2a5fa5"},
  Rose:    {bg:"#fff5f5",ink:"#4a1010",accent:"#c06060"},
  Forest:  {bg:"#f5fff7",ink:"#0f2e18",accent:"#3a7a50"},
};

var TIMEZONES = [
  {label:"UTC",offset:0,city:"Universal"},{label:"LON",offset:0,city:"London"},
  {label:"DUB",offset:1,city:"Dublin"},{label:"LIS",offset:0,city:"Lisbon"},
  {label:"MAD",offset:1,city:"Madrid"},{label:"PAR",offset:1,city:"Paris"},
  {label:"BER",offset:1,city:"Berlin"},{label:"ROM",offset:1,city:"Rome"},
  {label:"AMS",offset:1,city:"Amsterdam"},{label:"BCN",offset:1,city:"Barcelona"},
  {label:"VIE",offset:1,city:"Vienna"},{label:"ZRH",offset:1,city:"Zurich"},
  {label:"BRU",offset:1,city:"Brussels"},{label:"WAW",offset:1,city:"Warsaw"},
  {label:"BUD",offset:1,city:"Budapest"},{label:"PRG",offset:1,city:"Prague"},
  {label:"STO",offset:1,city:"Stockholm"},{label:"OSL",offset:1,city:"Oslo"},
  {label:"CPH",offset:1,city:"Copenhagen"},{label:"HEL",offset:2,city:"Helsinki"},
  {label:"RIG",offset:2,city:"Riga"},{label:"ATH",offset:2,city:"Athens"},
  {label:"CAI",offset:2,city:"Cairo"},{label:"JRS",offset:2,city:"Jerusalem"},
  {label:"JNB",offset:2,city:"Johannesburg"},{label:"MOS",offset:3,city:"Moscow"},
  {label:"IST",offset:3,city:"Istanbul"},{label:"RUH",offset:3,city:"Riyadh"},
  {label:"KWI",offset:3,city:"Kuwait City"},{label:"NBO",offset:3,city:"Nairobi"},
  {label:"DXB",offset:4,city:"Dubai"},{label:"ABU",offset:4,city:"Abu Dhabi"},
  {label:"BAK",offset:4,city:"Baku"},{label:"TBS",offset:4,city:"Tbilisi"},
  {label:"KBL",offset:4.5,city:"Kabul"},{label:"KHI",offset:5,city:"Karachi"},
  {label:"DEL",offset:5.5,city:"New Delhi"},{label:"BOM",offset:5.5,city:"Mumbai"},
  {label:"COL",offset:5.5,city:"Colombo"},{label:"KTM",offset:5.75,city:"Kathmandu"},
  {label:"DAC",offset:6,city:"Dhaka"},{label:"ALM",offset:6,city:"Almaty"},
  {label:"RGN",offset:6.5,city:"Yangon"},{label:"BKK",offset:7,city:"Bangkok"},
  {label:"JKT",offset:7,city:"Jakarta"},{label:"HAN",offset:7,city:"Hanoi"},
  {label:"SIN",offset:8,city:"Singapore"},{label:"KUL",offset:8,city:"Kuala Lumpur"},
  {label:"HKG",offset:8,city:"Hong Kong"},{label:"BJS",offset:8,city:"Beijing"},
  {label:"SHA",offset:8,city:"Shanghai"},{label:"TPE",offset:8,city:"Taipei"},
  {label:"MNL",offset:8,city:"Manila"},{label:"PER",offset:8,city:"Perth"},
  {label:"SEL",offset:9,city:"Seoul"},{label:"TYO",offset:9,city:"Tokyo"},
  {label:"ADL",offset:9.5,city:"Adelaide"},{label:"SYD",offset:10,city:"Sydney"},
  {label:"MEL",offset:10,city:"Melbourne"},{label:"GUM",offset:10,city:"Guam"},
  {label:"NOU",offset:11,city:"Noumea"},{label:"AKL",offset:12,city:"Auckland"},
  {label:"FJI",offset:12,city:"Suva"},{label:"AZO",offset:-1,city:"Azores"},
  {label:"HAV",offset:-5,city:"Havana"},{label:"NYC",offset:-5,city:"New York"},
  {label:"MIA",offset:-5,city:"Miami"},{label:"BOS",offset:-5,city:"Boston"},
  {label:"ATL",offset:-5,city:"Atlanta"},{label:"TOR",offset:-5,city:"Toronto"},
  {label:"MTL",offset:-5,city:"Montreal"},{label:"BOG",offset:-5,city:"Bogota"},
  {label:"LIM",offset:-5,city:"Lima"},{label:"CHI",offset:-6,city:"Chicago"},
  {label:"DAL",offset:-6,city:"Dallas"},{label:"HOU",offset:-6,city:"Houston"},
  {label:"MTY",offset:-6,city:"Monterrey"},{label:"MEX",offset:-6,city:"Mexico City"},
  {label:"DEN",offset:-7,city:"Denver"},{label:"PHX",offset:-7,city:"Phoenix"},
  {label:"LAX",offset:-8,city:"Los Angeles"},{label:"SFO",offset:-8,city:"San Francisco"},
  {label:"SEA",offset:-8,city:"Seattle"},{label:"VAN",offset:-8,city:"Vancouver"},
  {label:"ANC",offset:-9,city:"Anchorage"},{label:"HNL",offset:-10,city:"Honolulu"},
  {label:"SAO",offset:-3,city:"Sao Paulo"},{label:"RIO",offset:-3,city:"Rio de Janeiro"},
  {label:"BUE",offset:-3,city:"Buenos Aires"},{label:"SCL",offset:-4,city:"Santiago"},
  {label:"CCS",offset:-4,city:"Caracas"},{label:"ACC",offset:0,city:"Accra"},
  {label:"LOS",offset:1,city:"Lagos"},{label:"DKR",offset:0,city:"Dakar"},
  {label:"CMN",offset:1,city:"Casablanca"},{label:"ALG",offset:1,city:"Algiers"},
];

var state = {
  bg:"#ffffff", ink:"#1c2e0f", accent:"#76945c",
  lat:32.81, lon:-96.95, cityName:"Irving, TX",
  tz: TIMEZONES.find(function(t){return t.label==="NYC";})
};

function hexToRgb(hex){
  return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
}
function rgbToHex(r,g,b){
  return "#"+[r,g,b].map(function(v){return("0"+v.toString(16)).slice(-2);}).join("");
}
function blendHex(c1,c2,r){
  var a=hexToRgb(c1),b=hexToRgb(c2);
  return rgbToHex(Math.round(a[0]+(b[0]-a[0])*r),Math.round(a[1]+(b[1]-a[1])*r),Math.round(a[2]+(b[2]-a[2])*r));
}
function calcGhost(accent,bg){return blendHex(accent,bg,0.7);}
function isDark(hex){var rgb=hexToRgb(hex);return (rgb[0]*299+rgb[1]*587+rgb[2]*114)/1000 < 128;}

function applyThemeColors(bg, ink, accent) {
  document.getElementById("cBg").value     = bg;
  document.getElementById("cInk").value    = ink;
  document.getElementById("cAccent").value = accent;
  state.bg = bg; state.ink = ink; state.accent = accent;
  updateSiteTheme(bg, ink, accent);
  updatePreview();
}

function updateSiteTheme(bg, ink, accent) {
  var dark = isDark(bg);
  var siteBg   = dark ? blendHex(bg,"#000000",0.3) : blendHex(bg,"#000000",0.06);
  var siteCard = dark ? blendHex(bg,"#ffffff",0.08) : bg;
  var siteMuted= dark ? blendHex(ink,"#000000",0.4) : blendHex(ink,"#ffffff",0.4);
  var siteBorder=dark ? blendHex(bg,"#ffffff",0.15) : blendHex(bg,"#000000",0.12);
  var siteHover= dark ? blendHex(bg,"#ffffff",0.1)  : blendHex(accent,"#ffffff",0.85);
  document.documentElement.style.setProperty("--site-bg",    siteBg);
  document.documentElement.style.setProperty("--site-card",  siteCard);
  document.documentElement.style.setProperty("--site-ink",   ink);
  document.documentElement.style.setProperty("--site-muted", siteMuted);
  document.documentElement.style.setProperty("--site-border",siteBorder);
  document.documentElement.style.setProperty("--site-hover", siteHover);
  document.documentElement.style.setProperty("--accent",     accent);
}

// Build preset buttons
var presetsDiv = document.getElementById("presets");
Object.keys(THEMES).forEach(function(name) {
  var t = THEMES[name];
  var btn = document.createElement("button");
  btn.className = "theme-btn";
  btn.textContent = name;
  btn.style.background = t.bg;
  btn.style.color = t.ink;
  btn.style.borderColor = t.accent;
  btn.onclick = function() {
    applyThemeColors(t.bg, t.ink, t.accent);
    document.querySelectorAll(".theme-btn").forEach(function(b){b.classList.remove("active");});
    btn.classList.add("active");
  };
  presetsDiv.appendChild(btn);
});

// Saved schemes
function makeSchemeBtn(s, saved, i, container) {
  var btn = document.createElement("button");
  btn.className = "theme-btn";
  btn.textContent = s.name;
  btn.style.background = s.bg;
  btn.style.color = s.ink;
  btn.style.borderColor = s.accent;
  btn.title = "Click to apply • Right-click to delete";
  btn.onclick = function() {
    applyThemeColors(s.bg, s.ink, s.accent);
    document.querySelectorAll(".theme-btn").forEach(function(b){b.classList.remove("active");});
    btn.classList.add("active");
  };
  btn.oncontextmenu = function(e) {
    e.preventDefault();
    if (confirm("Delete scheme '" + s.name + "'?")) {
      saved.splice(i, 1);
      localStorage.setItem("sl_schemes", JSON.stringify(saved));
      loadSavedSchemes();
    }
  };
  container.appendChild(btn);
}

function loadSavedSchemes() {
  var saved = JSON.parse(localStorage.getItem("sl_schemes") || "[]");

  // Schemes in colors card
  var div = document.getElementById("savedSchemes");
  div.innerHTML = "";
  if (!saved.length) {
    div.innerHTML = '<span style="font-size:13px;color:var(--site-muted,#888)">No saved schemes yet</span>';
  } else {
    saved.forEach(function(s, i) { makeSchemeBtn(s, saved, i, div); });
  }

  // Schemes in presets section
  var wrap = document.getElementById("savedPresetsWrap");
  var presetBtns = document.getElementById("savedPresetBtns");
  presetBtns.innerHTML = "";
  if (saved.length) {
    wrap.style.display = "block";
    saved.forEach(function(s, i) { makeSchemeBtn(s, saved, i, presetBtns); });
  } else {
    wrap.style.display = "none";
  }
}

function saveScheme() {
  var name = document.getElementById("schemeName").value.trim();
  if (!name) { alert("Enter a name for your scheme"); return; }
  var bg     = document.getElementById("cBg").value;
  var ink    = document.getElementById("cInk").value;
  var accent = document.getElementById("cAccent").value;
  var saved  = JSON.parse(localStorage.getItem("sl_schemes") || "[]");
  // Check if already saved
  var exists = saved.find(function(s){ return s.name.toLowerCase() === name.toLowerCase(); });
  if (exists) {
    if (!confirm("A scheme named '" + name + "' already exists. Overwrite?")) return;
    exists.bg = bg; exists.ink = ink; exists.accent = accent;
  } else {
    saved.push({name:name, bg:bg, ink:ink, accent:accent});
  }
  localStorage.setItem("sl_schemes", JSON.stringify(saved));
  document.getElementById("schemeName").value = "";
  loadSavedSchemes();
}

// Timezone list
function renderTzList(filter) {
  var list = document.getElementById("tzList");
  list.innerHTML = "";
  var filtered = TIMEZONES.filter(function(tz) {
    if (!filter) return true;
    var q = filter.toLowerCase();
    return tz.city.toLowerCase().indexOf(q) >= 0 || tz.label.toLowerCase().indexOf(q) >= 0;
  });
  filtered.forEach(function(tz) {
    var item = document.createElement("div");
    item.className = "tz-item" + (state.tz && state.tz.label===tz.label ? " selected" : "");
    var sign = tz.offset >= 0 ? "+" : "";
    item.innerHTML = '<span>' + tz.city + ' <b>' + tz.label + '</b></span><span class="tz-offset">UTC'+sign+tz.offset+'</span>';
    item.onclick = function() {
      state.tz = tz;
      document.querySelectorAll(".tz-item").forEach(function(i){i.classList.remove("selected");});
      item.classList.add("selected");
      updatePreview();
    };
    list.appendChild(item);
  });
}
renderTzList("");
document.getElementById("tzSearch").addEventListener("input", function(){renderTzList(this.value);});

// City search
var searchTimer = null;
document.getElementById("cityInput").addEventListener("input", function() {
  clearTimeout(searchTimer);
  var q = this.value.trim();
  if (q.length < 3) { document.getElementById("suggestions").style.display="none"; return; }
  searchTimer = setTimeout(function(){searchCity(q);}, 300);
});

function searchCity(q) {
  fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=6&language=en")
    .then(function(r){return r.json();})
    .then(function(data) {
      var sug = document.getElementById("suggestions");
      sug.innerHTML = "";
      if (!data.results||!data.results.length){sug.style.display="none";return;}
      data.results.forEach(function(r) {
        var item = document.createElement("div");
        item.className = "suggest-item";
        var admin = r.admin1 ? ", "+r.admin1 : "";
        var label = r.name + admin + " (" + (r.country_code||"") + ")";
        item.textContent = label;
        item.onclick = function() {
          document.getElementById("cityInput").value = "";
          document.getElementById("citySelected").textContent = "📍 " + label;
          state.lat = r.latitude;
          state.lon = r.longitude;
          state.cityName = label;
          sug.style.display = "none";
        };
        sug.appendChild(item);
      });
      sug.style.display = "block";
    }).catch(function(){});
}
document.addEventListener("click", function(e) {
  if (!e.target.closest(".search-wrap"))
    document.getElementById("suggestions").style.display = "none";
});

// Preview update
function updatePreview() {
  var bg     = document.getElementById("cBg").value;
  var ink    = document.getElementById("cInk").value;
  var accent = document.getElementById("cAccent").value;
  state.bg = bg; state.ink = ink; state.accent = accent;

  var w = document.getElementById("watch");
  w.style.background = bg;
  document.getElementById("wTopBar").style.background = accent;
  document.getElementById("wTopBar").style.color = bg;
  document.getElementById("wBotBar").style.background = accent;
  document.getElementById("wBotBar").style.color = bg;
  document.getElementById("wRow1").style.color = ink;
  document.getElementById("wRow2").style.color = ink;
  document.getElementById("wTime").style.color = ink;
  document.getElementById("wDiv1").style.background = accent;
  document.getElementById("wDiv2").style.background = accent;
  ["r1a","r1b","r1c","r2a","r2b","r2c"].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.style.color = accent;
  });

  // TZ2 time centered in bottom bar
  if (state.tz) {
    var now = new Date();
    var utc = now.getTime() + now.getTimezoneOffset()*60000;
    var tz2 = new Date(utc + Number(state.tz.offset)*3600000);
    var h = tz2.getHours(), m = tz2.getMinutes();
    var ampm = h < 12 ? "AM" : "PM";
    var h12 = h%12||12;
    document.getElementById("wTZ").textContent = state.tz.label+" "+h12+":"+("0"+m).slice(-2)+" "+ampm;
  }
  var now2 = new Date();
  var h2 = now2.getHours()%12||12;
  document.getElementById("wTime").textContent = ("0"+h2).slice(-2)+":"+("0"+now2.getMinutes()).slice(-2);

  updateSiteTheme(bg, ink, accent);
}
setInterval(updatePreview, 30000);
["cBg","cInk","cAccent"].forEach(function(id){
  document.getElementById(id).addEventListener("input", updatePreview);
});

// Load settings from URL hash
function loadSettings() {
  if (location.hash && location.hash.length > 1) {
    try {
      var cfg = JSON.parse(decodeURIComponent(location.hash.slice(1)));
      if (cfg.bg)     document.getElementById("cBg").value     = cfg.bg;
      if (cfg.ink)    document.getElementById("cInk").value    = cfg.ink;
      if (cfg.accent) document.getElementById("cAccent").value = cfg.accent;
      if (cfg.lat)    state.lat = cfg.lat;
      if (cfg.lon)    state.lon = cfg.lon;
      if (cfg.cityName) {
        state.cityName = cfg.cityName;
        document.getElementById("citySelected").textContent = "📍 " + cfg.cityName;
      }
      if (cfg.tz) {
        var found = TIMEZONES.find(function(t){return t.label===cfg.tz.label;});
        if (found) { state.tz = found; renderTzList(""); }
      }
    } catch(e) {}
  }
  loadSavedSchemes();
  updatePreview();
}

// Save to Pebble
function saveSettings() {
  var bg     = document.getElementById("cBg").value;
  var ink    = document.getElementById("cInk").value;
  var accent = document.getElementById("cAccent").value;
  var ghost  = calcGhost(accent, bg);
  function pack(hex){var r=hexToRgb(hex);return r[0]*65536+r[1]*256+r[2];}
  var result = {
    bg:bg, ink:ink, accent:accent, ghost:ghost,
    bgRgb:hexToRgb(bg), inkRgb:hexToRgb(ink),
    accentRgb:hexToRgb(accent), ghostRgb:hexToRgb(ghost),
    lat:state.lat, lon:state.lon, cityName:state.cityName,
    tz:state.tz,
  };
  var ua = navigator.userAgent;
  if (ua.indexOf("Pebble")>=0||ua.indexOf("PebbleKit")>=0) {
    location.href = "pebblejs://close#" + encodeURIComponent(JSON.stringify(result));
  } else {
    // Desktop preview mode — show confirmation
    var msg = document.createElement("div");
    msg.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent,#76945c);color:#fff;padding:12px 24px;border-radius:10px;font-weight:600;font-size:15px;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.3)";
    msg.textContent = "✓ Settings saved (open in Pebble app to send to watch)";
    document.body.appendChild(msg);
    setTimeout(function(){ document.body.removeChild(msg); }, 3000);
  }
}

loadSettings();
</script>
