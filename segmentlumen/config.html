<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segment Lumen Settings</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--site-bg,#f0f0f0);color:var(--site-ink,#222);max-width:480px;margin:0 auto;padding:12px;transition:background .3s,color .3s}
h1{font-size:18px;text-align:center;margin:12px 0 16px;font-weight:700;letter-spacing:1px}
h2{font-size:11px;color:var(--site-muted,#888);margin:16px 0 8px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.card{background:var(--site-card,#fff);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.1);transition:background .3s}
.watch-wrap{display:flex;justify-content:center;margin:8px 0 4px}
.watch{width:180px;height:188px;border-radius:10px;overflow:hidden;border:2px solid #ddd;display:flex;flex-direction:column}
.w-bar{height:22px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:11px;font-weight:700;flex-shrink:0}
.w-row{height:22px;display:flex;align-items:center;justify-content:space-around;padding:0 8px;font-size:11px;font-weight:600}
.w-time-area{flex:1;display:flex;align-items:center;justify-content:center}
.w-time{font-family:monospace;font-size:44px;font-weight:900;letter-spacing:-1px}
.w-divider{height:1px;flex-shrink:0}
.w-tz-bar{height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.themes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.theme-btn{padding:8px 14px;border-radius:20px;border:2px solid #ddd;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.theme-btn.active{transform:scale(1.05);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.color-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.color-item label{font-size:12px;color:var(--site-muted,#666);margin-bottom:4px;display:block}
.color-swatch{width:100%;height:40px;border-radius:8px;border:1px solid #ddd;cursor:pointer;padding:3px}
.row{display:flex;gap:8px;margin-top:10px}
.row input[type=text]{flex:1;padding:10px;border:1.5px solid var(--site-border,#ddd);border-radius:10px;font-size:14px;background:var(--site-card,#fff);color:var(--site-ink,#222);outline:none}
.row input:focus{border-color:var(--accent,#76945c)}
.btn{padding:10px 16px;background:var(--accent,#76945c);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-outline{padding:10px 16px;background:transparent;color:var(--accent,#76945c);border:2px solid var(--accent,#76945c);border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.search-wrap{position:relative}
input[type=text]{width:100%;padding:10px 12px;border:1.5px solid var(--site-border,#ddd);border-radius:10px;font-size:15px;outline:none;background:var(--site-card,#fff);color:var(--site-ink,#222)}
input:focus{border-color:var(--accent,#76945c)}
#suggestions{position:absolute;top:100%;left:0;right:0;background:var(--site-card,#fff);border:1.5px solid var(--site-border,#ddd);border-top:none;border-radius:0 0 10px 10px;z-index:10;max-height:200px;overflow-y:auto;display:none}
.suggest-item{padding:10px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--site-border,#f0f0f0);color:var(--site-ink,#222)}
.suggest-item:hover{background:var(--site-hover,#f5f5f5)}
.save-btn{display:block;width:100%;padding:15px;background:var(--accent,#76945c);color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px}
.save-btn:active{filter:brightness(.9);transform:scale(.98)}
.city-selected{margin-top:6px;font-size:13px;color:var(--site-muted,#888)}
.scheme-id-box{background:var(--site-bg,#f0f0f0);border-radius:8px;padding:10px;margin-top:8px;font-family:monospace;font-size:13px;word-break:break-all;display:none}
.status{font-size:13px;margin-top:6px;color:var(--site-muted,#888)}
</style>
</head>
<body>
<h1>SEGMENT LUMEN</h1>

<div class="card">
<h2>Preview</h2>
<div class="watch-wrap">
  <div class="watch" id="watch">
    <div class="w-bar" id="wTopBar"><span>SAT</span><span>MAY 23</span><span>80%</span></div>
    <div class="w-row" id="wRow1"><span>37 <b id="r1a">STP</b></span><span>75 <b id="r1b">HR</b></span><span>ON <b id="r1c">BT</b></span></div>
    <div class="w-divider" id="wDiv1"></div>
    <div class="w-time-area"><span class="w-time" id="wTime">12:56</span></div>
    <div class="w-divider" id="wDiv2"></div>
    <div class="w-row" id="wRow2"><span>24 <b id="r2a">C</b></span><span id="r2b">CLOUD</span><span>6 <b id="r2c">UV</b></span></div>
    <div class="w-tz-bar" id="wBotBar"><span id="wTZ">NYC 5:55 PM</span></div>
  </div>
</div>
</div>

<div class="card">
<h2>Built-in Themes</h2>
<div class="themes" id="builtinThemes"></div>
<h2 style="margin-top:12px">User Schemes</h2>
<div class="themes" id="userSchemes"><span class="status">Loading...</span></div>
</div>

<div class="card">
<h2>Custom Colors</h2>
<div class="color-grid">
  <div class="color-item"><label>Background</label><input type="color" class="color-swatch" id="cBg" value="#ffffff"></div>
  <div class="color-item"><label>Text &amp; Segments</label><input type="color" class="color-swatch" id="cInk" value="#1c2e0f"></div>
  <div class="color-item"><label>Accent (bars)</label><input type="color" class="color-swatch" id="cAccent" value="#76945c"></div>
</div>
<div class="row">
  <input type="text" id="schemeName" placeholder="Name your scheme to share...">
  <button class="btn" onclick="publishScheme()">Share</button>
</div>
<div class="scheme-id-box" id="schemeIdBox"></div>
<div class="status" id="publishStatus"></div>
<div class="row" style="margin-top:8px">
  <input type="text" id="schemeIdInput" placeholder="Paste scheme ID to load...">
  <button class="btn-outline" onclick="loadSchemeById()">Load</button>
</div>
</div>

<div class="card">
<h2>Weather Location</h2>
<div class="search-wrap">
  <input type="text" id="cityInput" placeholder="Search city for weather..." autocomplete="off">
  <div id="suggestions"></div>
</div>
<div class="city-selected" id="citySelected"></div>
</div>

<div class="card">
<h2>2nd Time Zone</h2>
<select id="tzSelect" style="width:100%;padding:10px;border:1.5px solid var(--site-border,#ddd);border-radius:10px;font-size:15px;background:var(--site-card,#fff);color:var(--site-ink,#222);outline:none;cursor:pointer"></select>
</div>

<button class="save-btn" onclick="saveSettings()">Save to Watch</button>

<script>
// ── jsonbin.io config ────────────────────────────────────────────────────
// BIN_ID is public — safe to expose (read-only public bin)
// Writing is done via index.js on the phone (key stays private there)
var JSONBIN_BIN = "YOUR_MASTER_BIN_ID";

// ── Themes ────────────────────────────────────────────────────────────────
var BUILTIN_THEMES = {
  Green:   {bg:"#ffffff",ink:"#1c2e0f",accent:"#76945c"},
  Blue:    {bg:"#ffffff",ink:"#121e37",accent:"#406ea5"},
  Amber:   {bg:"#ffffff",ink:"#2e2008",accent:"#c48c2a"},
  Crimson: {bg:"#ffffff",ink:"#300e12",accent:"#aa383e"},
  Dark:    {bg:"#121212",ink:"#ebebeb",accent:"#6e9658"},
  Navy:    {bg:"#0a0f1e",ink:"#7eb8f7",accent:"#2a5fa5"},
  Rose:    {bg:"#fff5f5",ink:"#4a1010",accent:"#c06060"},
  Forest:  {bg:"#f5fff7",ink:"#0f2e18",accent:"#3a7a50"},
};

// ── Timezones ─────────────────────────────────────────────────────────────
// Helper: get DST-aware current UTC offset for an IANA timezone
function getCurrentOffset(iana) {
  if (!iana || typeof Intl === "undefined") return null;
  try {
    var now = new Date();
    var utc = now.getTime();
    // Get the time in the target zone
    var local = new Date(now.toLocaleString("en-US", {timeZone: iana}));
    var diff = (local - new Date(now.toLocaleString("en-US", {timeZone: "UTC"}))) / 3600000;
    return Math.round(diff * 100) / 100;
  } catch(e) { return null; }
}

var TIMEZONES = [
  {label:"UTC",offset:0,iana:"UTC",city:"Universal"},{label:"LON",iana:"Europe/London",offset:0,iana:"Europe/London",city:"London"},
  {label:"DUB",iana:"Europe/Dublin",offset:1,city:"Dublin"},{label:"LIS",iana:"Europe/Lisbon",offset:0,city:"Lisbon"},
  {label:"MAD",iana:"Europe/Madrid",offset:1,city:"Madrid"},{label:"PAR",iana:"Europe/Paris",offset:1,city:"Paris"},
  {label:"BER",iana:"Europe/Berlin",offset:1,city:"Berlin"},{label:"ROM",iana:"Europe/Rome",offset:1,city:"Rome"},
  {label:"AMS",iana:"Europe/Amsterdam",offset:1,city:"Amsterdam"},{label:"BCN",offset:1,city:"Barcelona"},
  {label:"VIE",iana:"Europe/Vienna",offset:1,city:"Vienna"},{label:"ZRH",iana:"Europe/Zurich",offset:1,city:"Zurich"},
  {label:"BRU",iana:"Europe/Brussels",offset:1,city:"Brussels"},{label:"WAW",iana:"Europe/Warsaw",offset:1,city:"Warsaw"},
  {label:"BUD",iana:"Europe/Budapest",offset:1,city:"Budapest"},{label:"PRG",iana:"Europe/Prague",offset:1,city:"Prague"},
  {label:"STO",iana:"Europe/Stockholm",offset:1,city:"Stockholm"},{label:"OSL",iana:"Europe/Oslo",offset:1,city:"Oslo"},
  {label:"CPH",iana:"Europe/Copenhagen",offset:1,city:"Copenhagen"},{label:"HEL",iana:"Europe/Helsinki",offset:2,city:"Helsinki"},
  {label:"RIG",offset:2,city:"Riga"},{label:"ATH",iana:"Europe/Athens",offset:2,city:"Athens"},
  {label:"CAI",iana:"Africa/Cairo",offset:2,city:"Cairo"},{label:"JRS",offset:2,city:"Jerusalem"},
  {label:"JNB",iana:"Africa/Johannesburg",offset:2,city:"Johannesburg"},{label:"MOS",iana:"Europe/Moscow",offset:3,city:"Moscow"},
  {label:"IST",iana:"Europe/Istanbul",offset:3,city:"Istanbul"},{label:"RUH",offset:3,city:"Riyadh"},
  {label:"KWI",offset:3,city:"Kuwait City"},{label:"NBO",offset:3,city:"Nairobi"},
  {label:"DXB",iana:"Asia/Dubai",offset:4,city:"Dubai"},{label:"ABU",offset:4,city:"Abu Dhabi"},
  {label:"BAK",offset:4,city:"Baku"},{label:"TBS",offset:4,city:"Tbilisi"},
  {label:"KBL",offset:4.5,city:"Kabul"},{label:"KHI",iana:"Asia/Karachi",offset:5,city:"Karachi"},
  {label:"DEL",iana:"Asia/Kolkata",offset:5.5,city:"New Delhi"},{label:"BOM",iana:"Asia/Kolkata",offset:5.5,city:"Mumbai"},
  {label:"COL",offset:5.5,city:"Colombo"},{label:"KTM",offset:5.75,city:"Kathmandu"},
  {label:"DAC",iana:"Asia/Dhaka",offset:6,city:"Dhaka"},{label:"ALM",offset:6,city:"Almaty"},
  {label:"RGN",offset:6.5,city:"Yangon"},{label:"BKK",iana:"Asia/Bangkok",offset:7,city:"Bangkok"},
  {label:"JKT",iana:"Asia/Jakarta",offset:7,city:"Jakarta"},{label:"HAN",offset:7,city:"Hanoi"},
  {label:"SIN",iana:"Asia/Singapore",offset:8,city:"Singapore"},{label:"KUL",offset:8,city:"Kuala Lumpur"},
  {label:"HKG",iana:"Asia/Hong_Kong",offset:8,city:"Hong Kong"},{label:"BJS",iana:"Asia/Shanghai",offset:8,city:"Beijing"},
  {label:"SHA",offset:8,city:"Shanghai"},{label:"TPE",offset:8,city:"Taipei"},
  {label:"MNL",offset:8,city:"Manila"},{label:"PER",offset:8,city:"Perth"},
  {label:"SEL",iana:"Asia/Seoul",offset:9,city:"Seoul"},{label:"TYO",iana:"Asia/Tokyo",offset:9,city:"Tokyo"},
  {label:"ADL",offset:9.5,city:"Adelaide"},{label:"SYD",iana:"Australia/Sydney",offset:10,city:"Sydney"},
  {label:"MEL",iana:"Australia/Melbourne",offset:10,city:"Melbourne"},{label:"AKL",iana:"Pacific/Auckland",offset:12,city:"Auckland"},
  {label:"NYC",iana:"America/New_York",offset:-5,city:"New York"},{label:"MIA",iana:"America/New_York",offset:-5,city:"Miami"},
  {label:"BOS",iana:"America/New_York",offset:-5,city:"Boston"},{label:"ATL",iana:"America/New_York",offset:-5,city:"Atlanta"},
  {label:"TOR",iana:"America/Toronto",offset:-5,city:"Toronto"},{label:"CHI",iana:"America/Chicago",offset:-6,city:"Chicago"},
  {label:"DAL",iana:"America/Chicago",offset:-6,city:"Dallas"},{label:"HOU",iana:"America/Chicago",offset:-6,city:"Houston"},
  {label:"MEX",iana:"America/Mexico_City",offset:-6,city:"Mexico City"},{label:"DEN",iana:"America/Denver",offset:-7,city:"Denver"},
  {label:"PHX",iana:"America/Phoenix",offset:-7,city:"Phoenix"},{label:"LAX",iana:"America/Los_Angeles",offset:-8,city:"Los Angeles"},
  {label:"SFO",iana:"America/Los_Angeles",offset:-8,city:"San Francisco"},{label:"SEA",iana:"America/Los_Angeles",offset:-8,city:"Seattle"},
  {label:"ANC",iana:"America/Anchorage",offset:-9,city:"Anchorage"},{label:"HNL",iana:"Pacific/Honolulu",offset:-10,city:"Honolulu"},
  {label:"SAO",iana:"America/Sao_Paulo",offset:-3,city:"Sao Paulo"},{label:"BUE",iana:"America/Argentina/Buenos_Aires",offset:-3,city:"Buenos Aires"},
  {label:"SCL",iana:"America/Santiago",offset:-4,city:"Santiago"},{label:"BOG",iana:"America/Bogota",offset:-5,city:"Bogota"},
  {label:"LIM",iana:"America/Lima",offset:-5,city:"Lima"},
];

var state = {
  bg:"#ffffff", ink:"#1c2e0f", accent:"#76945c",
  lat:32.81, lon:-96.95, cityName:"Irving, TX",
  tz: TIMEZONES.find(function(t){return t.label==="NYC";})
};

// ── Utilities ─────────────────────────────────────────────────────────────
function hexToRgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}
function rgbToHex(r,g,b){return"#"+[r,g,b].map(function(v){return("0"+v.toString(16)).slice(-2);}).join("");}
function blendHex(c1,c2,r){var a=hexToRgb(c1),b=hexToRgb(c2);return rgbToHex(Math.round(a[0]+(b[0]-a[0])*r),Math.round(a[1]+(b[1]-a[1])*r),Math.round(a[2]+(b[2]-a[2])*r));}
function calcGhost(accent,bg){return blendHex(accent,bg,0.7);}
function isDark(hex){var rgb=hexToRgb(hex);return(rgb[0]*299+rgb[1]*587+rgb[2]*114)/1000<128;}
function getQueryParam(name){var q=window.location.search.substring(1),vars=q.split("&");for(var i=0;i<vars.length;i++){var p=vars[i].split("=");if(decodeURIComponent(p[0])===name)return decodeURIComponent(p[1]||"");}return null;}

function applyThemeColors(bg, ink, accent) {
  document.getElementById("cBg").value     = bg;
  document.getElementById("cInk").value    = ink;
  document.getElementById("cAccent").value = accent;
  state.bg=bg; state.ink=ink; state.accent=accent;
  updateSiteTheme(bg, ink, accent);
  updatePreview();
}

function updateSiteTheme(bg, ink, accent) {
  var dark = isDark(bg);
  document.documentElement.style.setProperty("--site-bg",    dark?blendHex(bg,"#000000",0.3):blendHex(bg,"#000000",0.06));
  document.documentElement.style.setProperty("--site-card",  dark?blendHex(bg,"#ffffff",0.08):bg);
  document.documentElement.style.setProperty("--site-ink",   ink);
  document.documentElement.style.setProperty("--site-muted", dark?blendHex(ink,"#000000",0.4):blendHex(ink,"#ffffff",0.4));
  document.documentElement.style.setProperty("--site-border",dark?blendHex(bg,"#ffffff",0.15):blendHex(bg,"#000000",0.12));
  document.documentElement.style.setProperty("--site-hover", dark?blendHex(bg,"#ffffff",0.1):blendHex(accent,"#ffffff",0.85));
  document.documentElement.style.setProperty("--accent",     accent);
}

// ── Build built-in theme buttons ──────────────────────────────────────────
Object.keys(BUILTIN_THEMES).forEach(function(name) {
  var t = BUILTIN_THEMES[name];
  var btn = document.createElement("button");
  btn.className = "theme-btn";
  btn.textContent = name;
  btn.style.background=t.bg; btn.style.color=t.ink; btn.style.borderColor=t.accent;
  btn.onclick = function() {
    applyThemeColors(t.bg, t.ink, t.accent);
    document.querySelectorAll(".theme-btn").forEach(function(b){b.classList.remove("active");});
    btn.classList.add("active");
  };
  document.getElementById("builtinThemes").appendChild(btn);
});

// ── User schemes via jsonbin.io ───────────────────────────────────────────
function schemeBtn(s) {
  var btn = document.createElement("button");
  btn.className = "theme-btn";
  btn.textContent = s.name;
  btn.style.background=s.bg; btn.style.color=s.ink; btn.style.borderColor=s.accent;
  btn.title = "ID: " + (s.id||"");
  btn.onclick = function() {
    applyThemeColors(s.bg, s.ink, s.accent);
    document.querySelectorAll(".theme-btn").forEach(function(b){b.classList.remove("active");});
    btn.classList.add("active");
  };
  return btn;
}

function loadUserSchemes() {
  var div = document.getElementById("userSchemes");
  if (!JSONBIN_BIN || JSONBIN_BIN === "YOUR_MASTER_BIN_ID") {
    div.innerHTML = '<span class="status">Shared schemes not configured yet</span>';
    return;
  }
  // Public bin — no key needed for reads
  fetch("https://api.jsonbin.io/v3/b/" + JSONBIN_BIN + "/latest")
  .then(function(r){return r.json();})
  .then(function(data) {
    var schemes = (data.record && data.record.schemes) || [];
    div.innerHTML = "";
    if (!schemes.length) {
      div.innerHTML = '<span class="status">No shared schemes yet — be the first!</span>';
      return;
    }
    schemes.forEach(function(s) { div.appendChild(schemeBtn(s)); });
  }).catch(function() {
    div.innerHTML = '<span class="status">Could not load shared schemes</span>';
  });
}

function publishScheme() {
  var name = document.getElementById("schemeName").value.trim();
  if (!name) { alert("Enter a name for your scheme"); return; }
  if (!JSONBIN_BIN || JSONBIN_BIN === "YOUR_MASTER_BIN_ID") {
    document.getElementById("publishStatus").textContent = "Sharing not configured yet";
    return;
  }
  var writeKey = getQueryParam("wk") || "";
  if (!writeKey) {
    document.getElementById("publishStatus").textContent = "Write access not available — open settings from Pebble app";
    return;
  }
  var bg=document.getElementById("cBg").value;
  var ink=document.getElementById("cInk").value;
  var accent=document.getElementById("cAccent").value;
  var status = document.getElementById("publishStatus");
  status.textContent = "Sharing...";

  // Read current schemes first
  fetch("https://api.jsonbin.io/v3/b/" + JSONBIN_BIN + "/latest")
  .then(function(r){return r.json();})
  .then(function(data) {
    var schemes = (data.record && data.record.schemes) || [];
    var exists = schemes.find(function(s){return s.name.toLowerCase()===name.toLowerCase();});
    if (exists) {
      status.textContent = "A scheme named '"+name+"' already exists!";
      return Promise.reject("duplicate");
    }
    var newScheme = {name:name, bg:bg, ink:ink, accent:accent, id:Date.now().toString(36)};
    schemes.push(newScheme);
    return fetch("https://api.jsonbin.io/v3/b/" + JSONBIN_BIN, {
      method: "PUT",
      headers: {"Content-Type":"application/json", "X-Master-Key": writeKey},
      body: JSON.stringify({schemes:schemes})
    });
  })
  .then(function(r){ if(r) return r.json(); })
  .then(function(d) {
    if (d) {
      status.textContent = "✓ '"+name+"' shared with everyone!";
      document.getElementById("schemeName").value = "";
      loadUserSchemes();
    }
  })
  .catch(function(e){
    if (e !== "duplicate") status.textContent = "Failed to share — try again";
  });
}

function loadSchemeById() {
  var id = document.getElementById("schemeIdInput").value.trim();
  if (!id || !JSONBIN_BIN || JSONBIN_BIN === "YOUR_MASTER_BIN_ID") return;
  fetch("https://api.jsonbin.io/v3/b/"+JSONBIN_BIN+"/latest")
  .then(function(r){return r.json();})
  .then(function(data) {
    var schemes = (data.record && data.record.schemes) || [];
    var found = schemes.find(function(s){return s.id===id;});
    if (found) {
      applyThemeColors(found.bg, found.ink, found.accent);
      document.getElementById("schemeIdInput").value = "";
    } else {
      alert("Scheme ID not found");
    }
  });
}

// ── Timezone dropdown ─────────────────────────────────────────────────────
function buildTzDropdown(selectedLabel) {
  var sel = document.getElementById("tzSelect");
  sel.innerHTML = "";
  TIMEZONES.forEach(function(tz) {
    var opt = document.createElement("option");
    opt.value = tz.label;
    var sign = tz.offset >= 0 ? "+" : "";
    opt.textContent = tz.city + " (" + tz.label + ") UTC" + sign + tz.offset;
    if (tz.label === (selectedLabel || (state.tz && state.tz.label))) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = function() {
    var found = TIMEZONES.find(function(t){return t.label===sel.value;});
    if (found) { state.tz = found; updatePreview(); }
  };
}
buildTzDropdown();

// ── City search ───────────────────────────────────────────────────────────
var searchTimer=null;
document.getElementById("cityInput").addEventListener("input",function(){
  clearTimeout(searchTimer);
  var q=this.value.trim();
  if(q.length<3){document.getElementById("suggestions").style.display="none";return;}
  searchTimer=setTimeout(function(){searchCity(q);},300);
});
function searchCity(q) {
  fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=6&language=en")
    .then(function(r){return r.json();})
    .then(function(data){
      var sug=document.getElementById("suggestions");
      sug.innerHTML="";
      if(!data.results||!data.results.length){sug.style.display="none";return;}
      data.results.forEach(function(r){
        var item=document.createElement("div");
        item.className="suggest-item";
        var admin=r.admin1?", "+r.admin1:"";
        var lbl=r.name+admin+" ("+(r.country_code||"")+")";
        item.textContent=lbl;
        item.onclick=function(){
          document.getElementById("cityInput").value="";
          document.getElementById("citySelected").textContent="📍 "+lbl;
          state.lat=r.latitude; state.lon=r.longitude; state.cityName=lbl;
          sug.style.display="none";
        };
        sug.appendChild(item);
      });
      sug.style.display="block";
    }).catch(function(){});
}
document.addEventListener("click",function(e){
  if(!e.target.closest(".search-wrap"))
    document.getElementById("suggestions").style.display="none";
});

// ── Live preview ──────────────────────────────────────────────────────────
function updatePreview() {
  var bg=document.getElementById("cBg").value;
  var ink=document.getElementById("cInk").value;
  var accent=document.getElementById("cAccent").value;
  state.bg=bg; state.ink=ink; state.accent=accent;
  var w=document.getElementById("watch");
  w.style.background=bg;
  document.getElementById("wTopBar").style.background=accent;
  document.getElementById("wTopBar").style.color=bg;
  document.getElementById("wBotBar").style.background=accent;
  document.getElementById("wBotBar").style.color=bg;
  document.getElementById("wRow1").style.color=ink;
  document.getElementById("wRow2").style.color=ink;
  document.getElementById("wTime").style.color=ink;
  document.getElementById("wDiv1").style.background=accent;
  document.getElementById("wDiv2").style.background=accent;
  ["r1a","r1b","r1c","r2a","r2b","r2c"].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.style.color=accent;
  });
  if(state.tz){
    var now=new Date();
    var h,m;
    // Use IANA timezone if available for DST-correct time
    if(state.tz.iana && typeof Intl !== "undefined") {
      try {
        var parts = new Intl.DateTimeFormat("en-US",{
          timeZone:state.tz.iana, hour:"numeric", minute:"numeric", hour12:true
        }).formatToParts(now);
        var hp=parts.find(function(p){return p.type==="hour";}),
            mp=parts.find(function(p){return p.type==="minute";}),
            dp=parts.find(function(p){return p.type==="dayPeriod";});
        h=parseInt(hp.value,10); m=parseInt(mp.value,10);
        var ampm=(dp&&dp.value)||( h<12?"AM":"PM");
        if(ampm==="PM"&&h!==12) h+=12; if(ampm==="AM"&&h===12) h=0;
        document.getElementById("wTZ").textContent=state.tz.label+" "+(h%12||12)+":"+("0"+m).slice(-2)+" "+ampm;
      } catch(e) {
        // fallback to static offset
        var utcT=now.getUTCHours()*60+now.getUTCMinutes();
        var tot=(utcT+Math.round(Number(state.tz.offset)*60)+1440)%1440;
        h=Math.floor(tot/60); m=tot%60;
        document.getElementById("wTZ").textContent=state.tz.label+" "+(h%12||12)+":"+("0"+m).slice(-2)+" "+(h<12?"AM":"PM");
      }
    } else {
      var utcT=now.getUTCHours()*60+now.getUTCMinutes();
      var tot=(utcT+Math.round(Number(state.tz.offset)*60)+1440)%1440;
      h=Math.floor(tot/60); m=tot%60;
      document.getElementById("wTZ").textContent=state.tz.label+" "+(h%12||12)+":"+("0"+m).slice(-2)+" "+(h<12?"AM":"PM");
    }
  }
  var n=new Date(),h2=n.getHours()%12||12;
  document.getElementById("wTime").textContent=("0"+h2).slice(-2)+":"+("0"+n.getMinutes()).slice(-2);
  updateSiteTheme(bg,ink,accent);
}
setInterval(updatePreview,30000);
["cBg","cInk","cAccent"].forEach(function(id){
  document.getElementById(id).addEventListener("input",updatePreview);
});

// ── Load from query params (passed by Pebble app on showConfiguration) ────
function loadSettings() {
  var bg     = getQueryParam("bg")     || "#ffffff";
  var ink    = getQueryParam("ink")    || "#1c2e0f";
  var accent = getQueryParam("accent") || "#76945c";
  var lat    = getQueryParam("lat");
  var lon    = getQueryParam("lon");
  var city   = getQueryParam("city");
  var tzLabel= getQueryParam("tz");

  document.getElementById("cBg").value     = bg;
  document.getElementById("cInk").value    = ink;
  document.getElementById("cAccent").value = accent;

  if (lat) state.lat = parseFloat(lat);
  if (lon) state.lon = parseFloat(lon);
  if (city) {
    state.cityName = decodeURIComponent(city);
    document.getElementById("citySelected").textContent = "📍 " + state.cityName;
  }
  if (tzLabel) {
    var found = TIMEZONES.find(function(t){return t.label===tzLabel;});
    if (found) { state.tz=found; }
  }
  buildTzDropdown(state.tz ? state.tz.label : null);
  loadUserSchemes();
  updatePreview();
}

// ── Save to Pebble ────────────────────────────────────────────────────────
function saveSettings() {
  var bg     = document.getElementById("cBg").value;
  var ink    = document.getElementById("cInk").value;
  var accent = document.getElementById("cAccent").value;
  var ghost  = calcGhost(accent, bg);
  // Get DST-aware current offset for selected timezone
  var tzForSave = state.tz;
  if (state.tz && state.tz.iana) {
    var liveOffset = getCurrentOffset(state.tz.iana);
    if (liveOffset !== null) {
      tzForSave = {label:state.tz.label, offset:liveOffset, iana:state.tz.iana, city:state.tz.city};
    }
  }
  var result = {
    bg:bg, ink:ink, accent:accent, ghost:ghost,
    bgRgb:hexToRgb(bg), inkRgb:hexToRgb(ink),
    accentRgb:hexToRgb(accent), ghostRgb:hexToRgb(ghost),
    lat:state.lat, lon:state.lon, cityName:state.cityName,
    tz:tzForSave,
  };
  // Always use pebblejs://close# — this is the correct Pebble webview close pattern
  document.location = "pebblejs://close#" + encodeURIComponent(JSON.stringify(result));
}

loadSettings();
</script>
